services:
  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: userAdmin
      POSTGRES_PASSWORD: Eleva48Sjs@5DbPass
      POSTGRES_DB: eleva
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userAdmin -d eleva"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ./back
      dockerfile: dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  front:
    build:
      context: ./front
      dockerfile: dockerfile
    restart: always
    ports:
      - "1988:1988"
    env_file:
      - ./front/.env
    depends_on:
      - back
    command: sh -c "npm run build && npx next start -p 1988"

volumes:
  postgres_data:
